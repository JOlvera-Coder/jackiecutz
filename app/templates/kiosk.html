{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-black text-white p-4 sm:p-8 pb-24 flex justify-center items-center">
    <div class="w-full max-w-xl space-y-6">

<!-- KIOSK BRANDING HEADER -->
<div class="text-center space-y-2 flex flex-col items-center">
    <img src="{{ url_for('static', filename='img/icon-512.png') }}" alt="JackieCutz Logo" class="h-36 sm:h-44 w-auto mx-auto mb-2 drop-shadow-[0_0_15px_rgba(230,194,128,0.3)]">
    <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#e6c280] via-[#f7e3af] to-[#caa055] tracking-widest uppercase drop-shadow-[0_0_12px_rgba(247,227,175,0.4)]">
        Ivonne Gonzalez
    </h1>
    <p class="text-xs text-zinc-400 font-bold uppercase tracking-wider">JackieCutz Hair Studio • Kiosk Check-In</p>
</div>

        <!-- MAIN KIOSK CHECK-IN CARD -->
        <div class="bg-black border border-[#e6c280]/40 rounded-3xl p-6 sm:p-8 shadow-[0_0_30px_rgba(230,194,128,0.18)] space-y-6">
            
            <div class="text-center space-y-1 border-b border-zinc-900 pb-4">
                <h2 id="txt-kiosk-title" class="text-base sm:text-lg font-black uppercase text-[#f7e3af] tracking-wider drop-shadow-[0_0_6px_rgba(247,227,175,0.4)]">
                    WALK-IN CHECK-IN TERMINAL
                </h2>
                <p id="txt-kiosk-subtitle" class="text-xs text-amber-300/90 font-medium">
                    Please sign in to join today's active chair waitlist.
                </p>
            </div>

            <form id="kiosk-form" method="POST" action="/kiosk" class="space-y-4">
                
                <!-- FIRST NAME & LAST NAME -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label id="lbl-kiosk-fname" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                            First Name *
                        </label>
                        <input type="text" name="first_name" required placeholder="First Name"
                               class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-semibold focus:outline-none focus:border-[#f7e3af]">
                    </div>
                    <div>
                        <label id="lbl-kiosk-lname" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                            Last Name
                        </label>
                        <input type="text" name="last_name" placeholder="Last Name"
                               class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-semibold focus:outline-none focus:border-[#f7e3af]">
                    </div>
                </div>

                <!-- PHONE NUMBER -->
                <div>
                    <label id="lbl-kiosk-phone" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                        Phone Number *
                    </label>
                    <input type="tel" name="phone" required placeholder="832-000-0000"
                           class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-semibold focus:outline-none focus:border-[#f7e3af]">
                </div>

                <!-- EMAIL ADDRESS -->
                <div>
                    <label id="lbl-kiosk-email" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                        Email Address (For Receipt & Queue Alerts)
                    </label>
                    <input type="email" name="email" placeholder="name@example.com"
                           class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-semibold focus:outline-none focus:border-[#f7e3af]">
                </div>

                <!-- ZIP CODE -->
                <div>
                    <label id="lbl-kiosk-zip" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                        ZIP Code *
                    </label>
                    <input type="text" name="zip_code" required value="77073" placeholder="77073"
                           class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-semibold focus:outline-none focus:border-[#f7e3af]">
                </div>

                <!-- SELECT SERVICE -->
                <div>
                    <label id="lbl-kiosk-service" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                        Select Service *
                    </label>
                    <select name="service_id" id="kiosk_service_id" required class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-bold focus:outline-none focus:border-[#f7e3af]">
                        {% for s in services %}
                            <option value="{{ s.id }}">
                                {{ s.name }} — ${{ "%.2f"|format(s.price) }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- PAYMENT PREFERENCE -->
                <div>
                    <label id="lbl-kiosk-payment" class="block text-[11px] font-bold uppercase text-[#f7e3af] mb-1 tracking-wider">
                        Payment Preference *
                    </label>
                    <select name="payment_preference" class="w-full bg-[#fffee0] border border-[#e6c280]/30 rounded-2xl px-4 py-3 text-xs text-black font-bold focus:outline-none focus:border-[#f7e3af]">
                        <option value="cash">💈 In-Salon Cash (Preferred)</option>
                        <option value="zelle">⚡ Zelle (Ivonne Gonzalez)</option>
                        <option value="cashapp">💵 Cash App ($Jackiecutz)</option>
                    </select>
                </div>

                <!-- SUBMIT BUTTON -->
                <div class="pt-3">
                    <button type="submit" id="btn-kiosk-submit"
                            class="w-full py-4 px-4 bg-gradient-to-r from-[#e6c280] via-[#f7e3af] to-[#caa055] hover:brightness-110 text-black font-black uppercase tracking-widest text-xs sm:text-sm rounded-2xl shadow-[0_0_20px_rgba(230,194,128,0.35)] transition duration-150 transform active:scale-95">
                        SIGN IN & JOIN WAITLIST ✂️
                    </button>
                </div>
            </form>

            <div class="text-center pt-2">
                <p class="text-xs text-zinc-400 font-medium">
                    Prefer to book for a future date? 
                    <a href="{{ url_for('main.customer_portal') }}" class="text-[#f7e3af] hover:underline font-bold">Book Online</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
