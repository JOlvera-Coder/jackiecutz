{% extends "base.html" %}
{% block title %}Reset Password - Jackiecutz Hair Studio{% endblock %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<div style="max-width: 460px; margin: 25px auto; padding: 30px 20px; background: #0a0a0a; border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 20px; color: #ddd; font-family: 'Montserrat', sans-serif;">
    <h2 style="color: #d4af37; text-align: center; margin-top: 0; font-size: 1.35rem; letter-spacing: 1px;">RESET PASSWORD</h2>
    <p style="font-size: 0.88rem; color: #aaa; text-align: center; margin-bottom: 22px;">Enter your registered phone number or email address to request password assistance.</p>
    
    <form method="POST" action="{{ url_for('main.forgot_password') }}">
        <div style="margin-bottom: 22px;">
            <label style="color: #d4af37; font-weight: 800; font-size: 0.85rem; display: block; margin-bottom: 8px;">EMAIL OR PHONE NUMBER</label>
            <input type="text" name="identifier" placeholder="e.g. 832-353-4577 or name@example.com" style="width: 100%; padding: 15px; background: #fffde7; border: 1px solid #d4af37; border-radius: 14px; font-size: 1rem; color: #111; box-sizing: border-box;" required>
        </div>
        <button type="submit" style="width: 100%; padding: 16px; background: #d4af37; color: #000; font-weight: 800; font-size: 1rem; border: none; border-radius: 14px; cursor: pointer; text-transform: uppercase;">
            Submit Request
        </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('main.login') }}" style="color: #d4af37; font-weight: 700; text-decoration: none; font-size: 0.9rem;">← Back to Log In</a>
    </div>
</div>
{% endblock %}
