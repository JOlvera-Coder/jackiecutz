<div id="geofence-banner" style="display:none; position: fixed; bottom: 20px; right: 20px; background: #000; color: #d4af37; border: 1px solid #d4af37; border-radius: 8px; padding: 14px 20px; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <span id="geofence-text">📍 Proximity check active...</span>
</div>

<script>
(function initGeofenceTracker() {
    if (!("geolocation" in navigator)) {
        console.warn("Geolocation is not supported by this browser.");
        return;
    }

    const banner = document.getElementById("geofence-banner");
    const bannerText = document.getElementById("geofence-text");
    let hasAutoCheckedIn = false;

    navigator.geolocation.watchPosition(
        async function onPositionUpdate(position) {
            if (hasAutoCheckedIn) return;

            const payload = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracy: position.coords.accuracy
            };

            try {
                const response = await fetch('/api/geofence-checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) return;
                const result = await response.json();

                if (result.status === 'checked_in') {
                    hasAutoCheckedIn = true;
                    banner.style.display = 'block';
                    bannerText.innerHTML = "✨ <strong>Jackie Cutz:</strong> You are within 10 feet! You have been auto-signed in.";
                    setTimeout(() => { location.reload(); }, 3500);
                }
            } catch (err) {
                console.error("Geofence ping failed:", err);
            }
        },
        function onPositionError(error) {
            console.warn("GPS Tracking warning:", error.message);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 5000
        }
    );
})();
</script>
