<!DOCTYPE html>
<html lang="en" class="bg-black text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JackieCutz Hair Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .champagne-gold-text { color: #f7e3af; }
        .champagne-gold-border { border-color: #f7e3af; }
        .champagne-cream-bg { background-color: #fffde8; }
        .champagne-btn-gradient {
            background: linear-gradient(135deg, #f7e3af 0%, #e6c280 50%, #c7984d 100%);
        }
    </style>
</head>
<body class="bg-black min-h-screen flex flex-col items-center justify-center p-4 font-sans selection:bg-[#f7e3af] selection:text-black">

    <main class="w-full max-w-sm flex-1 flex flex-col justify-center">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
