<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackiecutz Hair Studio{% endblock %}</title>
    <!-- Tailwind CSS CDN for grid & component styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* True Illuminating Metallic Champagne Gold Spectrum */
            --champagne-highlight: #ffffff;
            --champagne-light: #fffaf0;
            --champagne-ivory: #fffaea;
            --champagne-gold: #dfba6b;
            --champagne-deep: #b5872a;
            --champagne-bronze: #694a11;
            --champagne-border: #dfba6b;
            --bg-jet-black: #000000;
        }

        html, body {
            background-color: #000000 !important;
            color: #f3f3f3;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Pure Studio Artwork Container (Seamless Jet Black) */
        .studio-logo-banner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 20px auto;
            background: #000000 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .studio-logo-banner img {
            width: 100%;
            height: auto;
            display: block;
            border: none !important;
            background: #000000 !important;
        }

        /* Metallic Champagne Gold Button (Buttons & Triggers) */
        .gold-btn, .gold-metallic-bg {
            background: linear-gradient(135deg, #ffffff 0%, #fff2cb 22%, #e5c16d 50%, #c39634 78%, #785213 100%) !important;
            color: #0d0d0d !important;
            font-weight: 800 !important;
            border: 1px solid #fff2cb !important;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(223, 186, 107, 0.45), 0 0 14px rgba(255, 242, 203, 0.4) inset !important;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.22s ease-in-out;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .gold-btn:hover, .gold-metallic-bg:hover {
            background: linear-gradient(135deg, #ffffff 0%, #fff7dc 30%, #ebd08c 65%, #b5872a 100%) !important;
            box-shadow: 0 6px 30px rgba(223, 186, 107, 0.75), 0 0 18px rgba(255, 255, 255, 0.7) inset !important;
            transform: translateY(-1px);
        }

        /* Unified Illuminating Metallic Champagne Gold Borders across Customer App, Kiosk, and Command Center */
        .border-amber-500,
        .border-amber-500\/30,
        .border-amber-500\/40,
        .border-amber-500\/50,
        .border-yellow-500,
        .border-yellow-600,
        [class*="border-amber"],
        [class*="border-yellow"],
        div.border,
        fieldset.border,
        section.border {
            border-color: #dfba6b !important;
            box-shadow: 0 0 10px rgba(223, 186, 107, 0.18);
        }

        /* Matching Champagne Ivory Input Fields (#fffaea) */
        .gold-input, input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select, textarea {
            background: #fffaea !important;
            color: #000000 !important;
            border: 1px solid #dfba6b !important;
            font-weight: 700 !important;
        }

        .gold-label {
            color: #dfba6b !important;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        /* Live Time Slot Pills */
        #slots-container button, 
        #time-slots-container button, 
        #slots-grid button,
        .time-slot-btn, 
        .slot-btn, 
        button[data-slot], 
        button[data-time],
        [id^="slot-"] {
            background-color: #fffaea !important;
            background: #fffaea !important;
            color: #000000 !important;
            border: 1px solid #dfba6b !important;
            font-size: 0.78rem !important;
            font-weight: 800 !important;
            border-radius: 9999px !important;
            padding: 8px 10px !important;
            text-align: center !important;
            box-shadow: 0 2px 6px rgba(216, 176, 86, 0.2) !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        #slots-container button *, 
        #time-slots-container button *, 
        #slots-grid button *,
        .time-slot-btn *, 
        .slot-btn *, 
        button[data-slot] *, 
        button[data-time] *,
        [id^="slot-"] * {
            color: #000000 !important;
            font-weight: 800 !important;
            font-size: 0.78rem !important;
        }

        /* "+ Add Additional Person / Child" Pill Button */
        #btn-add-person,
        #btn-add-child,
        #txt-add-person-btn,
        button#btn-add-person,
        button[onclick*="addPerson"],
        button[onclick*="addChild"],
        button.w-full.py-2\.5.border,
        button.w-full.py-2\.5,
        div:has(> #txt-add-person-btn) button,
        button:has(#txt-add-person-btn) {
            background-color: #fffaea !important;
            background: #fffaea !important;
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            border: 1px solid #dfba6b !important;
            font-weight: 800 !important;
            border-radius: 9999px !important;
            box-shadow: 0 2px 8px rgba(216, 176, 86, 0.25) !important;
            transition: all 0.2s ease-in-out !important;
        }

        #btn-add-person *,
        #btn-add-child *,
        #txt-add-person-btn,
        button#btn-add-person * {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            font-weight: 800 !important;
        }

        /* Payment & Card Method Tabs - Complete Cream (#fffaea) Interior */
        div.grid.grid-cols-2.sm\:grid-cols-4 > div,
        div.grid.grid-cols-2.sm\:grid-cols-4 > button,
        div.grid.grid-cols-4 > div,
        div.grid.grid-cols-4 > button,
        div.grid.grid-cols-2 > div:has(input[name*="pay"]),
        div.grid.grid-cols-2 > button:has(input[name*="pay"]),
        div[id*="pay-method"] button,
        div[id*="pay-method"] > div,
        div[id*="payment"] button,
        div[id*="payment"] > div,
        button[id^="pay-"],
        button[data-payment],
        button[data-pay],
        .payment-tab,
        .pay-option,
        button[onclick*="selectPayment"],
        button[onclick*="setPayment"],
        label[for*="pay"],
        div:has(> input[name="payment_method"]),
        button:has(span:contains("Card Hold")),
        button:has(span:contains("Zelle")),
        button:has(span:contains("Cash App")),
        button:has(span:contains("In-Salon")),
        div:has(> span:contains("Card Hold")),
        div:has(> span:contains("Zelle")),
        div:has(> span:contains("Cash App")),
        div:has(> span:contains("In-Salon")) {
            background-color: #fffaea !important;
            background: #fffaea !important;
            border: 1.5px solid #dfba6b !important;
            border-radius: 14px !important;
            box-shadow: 0 2px 6px rgba(216, 176, 86, 0.2) !important;
            transition: all 0.2s ease-in-out !important;
        }

        /* Payment Method Active Selection Highlight */
        div.grid.grid-cols-2.sm\:grid-cols-4 > .selected,
        div.grid.grid-cols-4 > .selected,
        div[id*="pay-method"] button.selected,
        div[id*="payment"] button.selected,
        button[id^="pay-"].active,
        button[data-payment].active,
        .payment-tab.selected,
        .pay-option.selected {
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 16px rgba(223, 186, 107, 0.8), 0 0 6px #ffffff inset !important;
        }

        /* "Estimated Total (Pay Upon Service)" Bar */
        #total-container,
        #booking-total-container,
        div.flex.justify-between.items-center.p-3.bg-zinc-950,
        div.flex.justify-between.items-center.p-3.bg-black,
        div.flex.justify-between.items-center.p-3.rounded-xl,
        div.flex.justify-between.items-center.p-3.rounded-2xl,
        div.flex.justify-between.items-center:has(#booking-total-price),
        div.flex.justify-between.items-center:has(#txt-total-label),
        div:has(> #booking-total-price) {
            background-color: #fffaea !important;
            background: #fffaea !important;
            border: 1px solid #dfba6b !important;
            border-radius: 9999px !important;
            box-shadow: 0 2px 8px rgba(216, 176, 86, 0.25) !important;
            padding: 12px 18px !important;
        }

        #total-container *,
        #booking-total-container *,
        #booking-total-price,
        #txt-total-label,
        div:has(> #booking-total-price) *,
        div.flex.justify-between.items-center:has(#booking-total-price) * {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            font-weight: 900 !important;
        }
    </style>
</head>
<body style="background-color: #000000 !important;">
    {% block content %}{% endblock %}
</body>
</html>
