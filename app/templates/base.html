<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackiecutz Hair Studio{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-bright: #fff0b3;
            --gold-primary: #e6c36a;
            --gold-deep: #b88628;
            --gold-shadow: #54390b;
            --bg-jet-black: #000000;
            --card-jet-black: #080808;
            --input-jet-black: #111111;
        }

        html, body {
            background-color: #000000 !important;
            color: #f3f3f3;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Pure Studio Artwork Container (Seamless Jet Black, No Outlines) */
        .studio-logo-banner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 20px auto;
            background: #000000 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .studio-logo-banner img {
            width: 100%;
            height: auto;
            display: block;
            border: none !important;
            background: #000000 !important;
        }

        /* Luminous Rich Champagne Gold Button */
        .gold-btn, .gold-metallic-bg {
            background: linear-gradient(135deg, #fff3cc 0%, #e6c36a 28%, #d4af37 55%, #b88628 85%, #6b4e12 100%) !important;
            color: #080808 !important;
            font-weight: 800 !important;
            border: 1px solid #fff0b3 !important;
            border-radius: 10px;
            box-shadow: 0 4px 22px rgba(230, 195, 106, 0.45), 0 0 12px rgba(255, 243, 204, 0.35) inset !important;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.22s ease-in-out;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .gold-btn:hover, .gold-metallic-bg:hover {
            background: linear-gradient(135deg, #ffffff 0%, #fff0b3 25%, #e6c36a 60%, #b88628 100%) !important;
            box-shadow: 0 6px 30px rgba(230, 195, 106, 0.75), 0 0 16px rgba(255, 255, 255, 0.6) inset !important;
            transform: translateY(-1px);
        }

        .gold-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-jet-black);
            border: 1px solid #201a12;
            border-radius: 8px;
            color: #fff0b3;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .gold-input:focus {
            outline: none;
            border-color: #e6c36a;
            box-shadow: 0 0 12px rgba(230, 195, 106, 0.4);
        }

        .gold-label {
            color: #e6c36a;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff0b3 !important;
            -webkit-box-shadow: 0 0 0px 1000px #111111 inset !important;
            border: 1px solid #e6c36a !important;
            caret-color: #fff0b3 !important;
        }
    </style>
</head>
<body style="background-color: #000000 !important;">
    {% block content %}{% endblock %}
</body>
</html>
