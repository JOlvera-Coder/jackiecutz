<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackiecutz Hair Studio{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f5d77f;
            --gold-dark: #9e7526;
            --gold-border: #c89e4b;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #f3f3f3;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .gold-metallic-bg {
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #9e7526 100%) !important;
            color: #000 !important;
            font-weight: 800;
            border: none;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .gold-metallic-bg:hover {
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
        }

        .gold-metallic-text {
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 60%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-metallic-border {
            border: 1px solid #c89e4b !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f5d77f !important;
            -webkit-box-shadow: 0 0 0px 1000px #141414 inset !important;
            border: 1px solid #c89e4b !important;
            caret-color: #f5d77f !important;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
