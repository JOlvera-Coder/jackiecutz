<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackiecutz Hair Studio{% endblock %}</title>
    <!-- Tailwind CSS CDN for grid & component styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* True Illuminating Metallic Champagne Gold Spectrum */
            --champagne-highlight: #ffffff;
            --champagne-light: #fff6d6;
            --champagne-cream: #faeac0;
            --champagne-gold: #dfba6b;
            --champagne-deep: #b5872a;
            --champagne-bronze: #694a11;
            --champagne-border: #d8b056;
            --bg-jet-black: #000000;
        }

        html, body {
            background-color: #000000 !important;
            color: #f3f3f3;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Pure Studio Artwork Container (Seamless Jet Black) */
        .studio-logo-banner {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 20px auto;
            background: #000000 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .studio-logo-banner img {
            width: 100%;
            height: auto;
            display: block;
            border: none !important;
            background: #000000 !important;
        }

        /* Metallic Champagne Gold Button (Buttons & Triggers) */
        .gold-btn, .gold-metallic-bg {
            background: linear-gradient(135deg, #ffffff 0%, #fff2cb 22%, #e5c16d 50%, #c39634 78%, #785213 100%) !important;
            color: #0d0d0d !important;
            font-weight: 800 !important;
            border: 1px solid #fff2cb !important;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(223, 186, 107, 0.45), 0 0 14px rgba(255, 242, 203, 0.4) inset !important;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.22s ease-in-out;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .gold-btn:hover, .gold-metallic-bg:hover {
            background: linear-gradient(135deg, #ffffff 0%, #fff7dc 30%, #ebd08c 65%, #b5872a 100%) !important;
            box-shadow: 0 6px 30px rgba(223, 186, 107, 0.75), 0 0 18px rgba(255, 255, 255, 0.7) inset !important;
            transform: translateY(-1px);
        }

        /* Matching Champagne Gold Input Fields */
        .gold-input, input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select {
            background: #fffdf5 !important;
            color: #111111 !important;
            border: 1px solid #d8b056 !important;
            font-weight: 600;
        }

        .gold-label {
            color: #dfba6b !important;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }

        /* Available Live Time Slots (Matching Pill Tabs & Visible Typography) */
        #slots-container button, 
        #time-slots-container button, 
        #slots-grid button,
        .time-slot-btn, 
        .slot-btn, 
        button[data-slot], 
        button[data-time],
        [id^="slot-"] {
            background: linear-gradient(135deg, #fffcf0 0%, #faeac0 50%, #ecd08c 100%) !important;
            color: #1a1508 !important;
            border: 1px solid #d8b056 !important;
            font-size: 0.8rem !important;
            font-weight: 800 !important;
            border-radius: 9999px !important;
            padding: 9px 12px !important;
            text-align: center !important;
            box-shadow: 0 2px 8px rgba(216, 176, 86, 0.25) !important;
            transition: all 0.2s ease-in-out !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Slot Hover State (Illuminated Glow) */
        #slots-container button:hover, 
        #time-slots-container button:hover, 
        #slots-grid button:hover,
        .time-slot-btn:hover, 
        .slot-btn:hover, 
        button[data-slot]:hover, 
        button[data-time]:hover,
        [id^="slot-"]:hover {
            background: linear-gradient(135deg, #ffffff 0%, #fff7dc 40%, #e0b85c 100%) !important;
            color: #000000 !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 16px rgba(223, 186, 107, 0.7) !important;
            transform: translateY(-1px);
        }

        /* Slot Active/Selected State (Deep Champagne Gold with High Glow) */
        #slots-container button.selected, 
        #time-slots-container button.selected, 
        #slots-grid button.selected,
        #slots-container button.active,
        #time-slots-container button.active,
        .time-slot-btn.selected, 
        .time-slot-btn.active, 
        .slot-btn.selected, 
        button[data-slot].selected, 
        button[data-time].selected,
        [id^="slot-"].selected {
            background: linear-gradient(135deg, #ffffff 0%, #e5c16d 45%, #b5872a 100%) !important;
            color: #000000 !important;
            font-weight: 900 !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 20px rgba(223, 186, 107, 0.95), 0 0 8px #ffffff inset !important;
        }
    </style>
</head>
<body style="background-color: #000000 !important;">
    {% block content %}{% endblock %}
</body>
</html>
