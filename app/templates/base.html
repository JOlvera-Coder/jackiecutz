<!DOCTYPE html>
<html lang="en">
<!-- PWA Web Manifest & Service Worker Registration -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#dfba6b">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    });
  }
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jackiecutz Hair Studio{% endblock %}</title>

    <!-- Tailwind CSS & Font CDN Links -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">

    <!-- SEO & AI Schema Markup for Jackiecutz -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HairSalon",
      "name": "Jackiecutz",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Divine Salon Suite 105",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "postalCode": "77073",
        "addressCountry": "US"
      },
      "url": "http://127.0.0.1:5000",
      "telephone": "+18323534577",
      "priceRange": "$$"
    }
    </script>
</head>
<body class="bg-black text-white font-['Montserrat'] antialiased selection:bg-amber-500 selection:text-black">

    {% block content %}
    {% endblock %}

</body>
</html>
