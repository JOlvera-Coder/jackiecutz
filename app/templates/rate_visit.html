{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-black text-white flex flex-col items-center justify-center p-4">

    <!-- LOGO HEADER -->
    <div class="w-48 mx-auto mb-4 text-center">
        <img src="{{ url_for('static', filename='img/jackiecutz_logo.png') }}" alt="Jackiecutz Logo" class="w-full h-auto object-contain mix-blend-screen">
    </div>

    <!-- POST-SERVICE RATING CARD -->
    <div class="w-full max-w-md bg-zinc-950 border border-amber-500/40 rounded-3xl p-6 space-y-4 shadow-[0_0_25px_rgba(245,158,11,0.15)]">
        
        <div class="text-center space-y-1">
            <span class="text-[10px] font-black uppercase text-amber-400 tracking-widest block">SERVICE COMPLETED</span>
            <h2 class="text-lg font-black text-white">How Was Your Visit Today?</h2>
            <p class="text-xs text-zinc-400">Please rate your haircut and service with Ivonne at Suite 105.</p>
        </div>

        <form method="POST" action="{{ url_for('main.rate_visit') }}" class="space-y-4">
            <input type="hidden" name="booking_id" value="{{ booking_id }}">
            
            <div class="flex justify-center space-x-3 text-3xl py-2" id="star-rating">
                <input type="hidden" name="rating" id="rating-val" value="5">
                <button type="button" onclick="setRating(1)" class="star text-amber-400 hover:scale-110 transition">★</button>
                <button type="button" onclick="setRating(2)" class="star text-amber-400 hover:scale-110 transition">★</button>
                <button type="button" onclick="setRating(3)" class="star text-amber-400 hover:scale-110 transition">★</button>
                <button type="button" onclick="setRating(4)" class="star text-amber-400 hover:scale-110 transition">★</button>
                <button type="button" onclick="setRating(5)" class="star text-amber-400 hover:scale-110 transition">★</button>
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] font-bold text-zinc-400 uppercase">Your Name</label>
                <input type="text" name="client_name" value="{{ client_name }}" placeholder="Your Name" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] font-bold text-zinc-400 uppercase">Comments or Feedback</label>
                <textarea name="feedback" rows="3" placeholder="Let us know how we did..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#e6c280] via-[#f7e3af] to-[#caa055] text-black font-black uppercase text-xs rounded-xl shadow-lg hover:brightness-110 transition">
                SUBMIT RATING ⭐
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="{{ url_for('main.customer_portal') }}" class="text-xs text-zinc-500 hover:text-zinc-300">Skip & Return to App</a>
        </div>

    </div>

</div>

<script>
function setRating(val) {
    document.getElementById('rating-val').value = val;
    const stars = document.querySelectorAll('.star');
    stars.forEach((star, index) => {
        if (index < val) {
            star.classList.add('text-amber-400');
            star.classList.remove('text-zinc-600');
        } else {
            star.classList.add('text-zinc-600');
            star.classList.remove('text-amber-400');
        }
    });
}
</script>
{% endblock %}
