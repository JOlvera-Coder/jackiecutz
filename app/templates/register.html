{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-black text-white flex flex-col items-center justify-center p-4">

    <!-- LOGO HEADER -->
    <div class="w-full max-w-md mx-auto mb-6 text-center flex justify-center">
        <img src="{{ url_for('static', filename='img/card_bg.jpg') }}" alt="Jackiecutz Hair Studio - Ivonne Gonzalez" class="w-full h-auto object-cover rounded-2xl shadow-[0_0_25px_rgba(247,227,175,0.2)]">
    </div>

    <!-- REGISTER CARD -->
    <div class="w-full max-w-md bg-black/90 border-2 border-[#f7e3af]/60 rounded-3xl p-6 sm:p-8 space-y-5 shadow-[0_0_30px_rgba(247,227,175,0.15)] backdrop-blur-md">
        
        <div class="text-center space-y-1">
            <h2 class="text-xl font-black uppercase text-[#f7e3af] tracking-wider">CLIENT REGISTRATION</h2>
            <p class="text-xs text-zinc-400">Create your studio profile for fast appointment booking.</p>
        </div>

        <form method="POST" action="{{ url_for('main.register') }}" class="space-y-4">
            
            <div class="space-y-1">
                <label class="block text-[10px] sm:text-xs font-black uppercase tracking-wider text-[#f7e3af]">
                    USERNAME *
                </label>
                <input type="text" name="username" required
                       class="w-full px-4 py-3 bg-[#fffde8] text-black font-semibold rounded-2xl border border-[#f7e3af] focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">FIRST NAME *</label>
                    <input type="text" name="first_name" required
                           class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">LAST NAME *</label>
                    <input type="text" name="last_name" required
                           class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] sm:text-xs font-black uppercase tracking-wider text-[#f7e3af]">PHONE NUMBER *</label>
                <input type="tel" name="phone" required
                       class="w-full px-4 py-3 bg-[#fffde8] text-black font-semibold rounded-2xl border border-[#f7e3af] focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] sm:text-xs font-black uppercase tracking-wider text-[#f7e3af]">EMAIL ADDRESS *</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 bg-[#fffde8] text-black font-semibold rounded-2xl border border-[#f7e3af] focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">PASSWORD *</label>
                    <input type="password" name="password" required
                           class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">CONFIRM PASSWORD *</label>
                    <input type="password" name="confirm_password" required
                           class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">ZIP CODE *</label>
                    <input type="text" name="zip" required value=""
                           class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-[#f7e3af]">GENDER</label>
                    <select name="gender" class="w-full px-3 py-2.5 bg-[#fffde8] text-black font-semibold rounded-xl border border-[#f7e3af] text-sm">
                        <option value="" selected disabled>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] sm:text-xs font-black uppercase tracking-wider text-[#f7e3af]">BIRTHDAY (OPTIONAL)</label>
                <input type="date" name="birthday"
                       class="w-full px-4 py-3 bg-[#fffde8] text-black font-semibold rounded-2xl border border-[#f7e3af] text-sm">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 bg-gradient-to-r from-[#e6c280] via-[#f7e3af] to-[#caa055] hover:brightness-110 text-black font-black uppercase tracking-widest text-sm rounded-2xl shadow-[0_0_20px_rgba(230,194,128,0.3)] transition transform active:scale-95">
                CREATE ACCOUNT ✂️
            </button>
        </form>

        <div class="border-t border-zinc-800/80 pt-4 text-center space-y-2">
            <p class="text-xs text-zinc-300">
                Already have an account? 
                <a href="{{ url_for('main.login') }}" class="font-bold text-[#f7e3af] underline hover:text-amber-300">
                    Log In
                </a>
            </p>
            <p class="text-[10px] text-zinc-400 leading-relaxed px-2">
                By registering, you agree to our 
                <a href="{{ url_for('main.terms') }}" class="underline hover:text-white">Terms & Conditions</a> 
                and 
                <a href="{{ url_for('main.privacy') }}" class="underline hover:text-white">Privacy Policy</a>.
            </p>
        </div>

    </div>

</div>
{% endblock %}
