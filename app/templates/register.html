{% extends "base.html" %}

{% block content %}
<div class="w-full bg-black border border-[#f7e3af]/50 card-gold-glow rounded-[32px] p-6 space-y-5">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="p-2.5 rounded-xl text-xs text-center border font-medium {% if category == 'success' %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% else %}bg-rose-500/10 border-rose-500/30 text-rose-400{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('main.register') }}" method="POST" class="space-y-3.5">
        
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">FIRST NAME</label>
                <input type="text" name="first_name" required placeholder="First Name"
                    class="w-full px-3 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">LAST NAME</label>
                <input type="text" name="last_name" required placeholder="Last Name"
                    class="w-full px-3 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">USERNAME</label>
            <input type="text" name="username" required placeholder="Choose a username"
                class="w-full px-4 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
        </div>

        <div>
            <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">EMAIL ADDRESS</label>
            <input type="email" name="email" required placeholder="name@example.com"
                class="w-full px-4 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">PHONE NUMBER</label>
                <input type="tel" name="phone" required placeholder="(832) 000-0000"
                    class="w-full px-3 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
            </div>
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">ZIP CODE</label>
                <input type="text" name="zip_code" required placeholder="77073"
                    class="w-full px-3 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">GENDER</label>
                <select name="gender" required class="w-full px-3 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs focus:outline-none">
                    <option value="" disabled selected>Select</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Non-Binary">Non-Binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">BIRTHDATE</label>
                <input type="date" name="birthday" required
                    class="w-full px-2 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">PASSWORD</label>
            <input type="password" name="password" required placeholder="••••••••"
                class="w-full px-4 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
        </div>

        <div>
            <label class="block text-[10px] font-black text-[#f7e3af] gold-glow uppercase tracking-wider mb-1">CONFIRM PASSWORD</label>
            <input type="password" name="confirm_password" required placeholder="Re-enter password"
                class="w-full px-4 py-3 bg-[#fffde8] text-zinc-900 font-semibold rounded-2xl border-2 border-[#f7e3af] text-xs placeholder-zinc-400 focus:outline-none">
        </div>

        <!-- SOLID GOLD HIGH-CONTRAST REGISTER BUTTON -->
        <button type="submit" 
            style="background-color: #f7e3af !important; color: #000000 !important; font-weight: 900 !important; display: block !important; width: 100% !important; padding: 16px !important; border-radius: 9999px !important; text-align: center !important; letter-spacing: 0.1em !important; font-size: 13px !important; text-transform: uppercase !important; margin-top: 12px !important; border: none !important;"
            class="shadow-lg active:scale-[0.98] transition-all cursor-pointer">
            CREATE ACCOUNT NOW
        </button>
    </form>

    <div class="text-center pt-4 border-t border-zinc-800/80 mt-4">
        <p class="text-xs text-zinc-200">
            Already have an account? 
            <a href="{{ url_for('main.login') }}" class="font-extrabold text-white hover:text-[#f7e3af] underline ml-1">Log In</a>
        </p>
    </div>

</div>
{% endblock %}
