{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen bg-black text-white p-6 flex flex-col items-center justify-center">
    <div class="w-full max-w-lg bg-zinc-950 border border-[#e6c280]/40 rounded-3xl p-8 space-y-6 shadow-[0_0_30px_rgba(230,194,128,0.15)]">
        
        <!-- BACK TO DESKTOP INDEX BUTTON -->
        <div class="border-b border-zinc-900 pb-4">
            <a href="{{ url_for('main.index') }}#booking-section" class="inline-flex items-center gap-2 text-xs font-black uppercase tracking-widest text-[#f7e3af] hover:underline">
                ← Back to Main Website
            </a>
        </div>

        <div class="text-center space-y-2">
            <img src="{{ url_for('static', filename='img/card_bg.jpg') }}" alt="Jackiecutz Logo" class="h-16 mx-auto object-contain">
            <h2 class="text-base font-black uppercase tracking-widest text-[#f7e3af]">Create Client Account</h2>
            <p class="text-xs text-zinc-400">Register to save your booking history and confirm your spot</p>
        </div>

        <form method="POST" action="{{ url_for('main.register_desktop') }}" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">First Name</label>
                    <input type="text" name="first_name" required placeholder="First Name"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Last Name</label>
                    <input type="text" name="last_name" required placeholder="Last Name"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Username</label>
                    <input type="text" name="username" required placeholder="Username"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Phone Number</label>
                    <input type="tel" name="phone" required placeholder="832-000-0000"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="client@domain.com"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Zip Code</label>
                    <input type="text" name="zip_code" required placeholder="77073"
                           class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase text-zinc-400 tracking-wider mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full bg-[#fffee0] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-black font-semibold">
            </div>

            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#e6c280] via-[#f7e3af] to-[#caa055] text-black font-black uppercase tracking-widest text-xs rounded-xl shadow-md hover:brightness-110 transition">
                Create Account & Return To Booking ✂️
            </button>
        </form>

        <div class="text-center text-xs text-zinc-400 pt-2 border-t border-zinc-900">
            Already have an account? 
            <a href="{{ url_for('main.login_desktop') }}" class="text-[#f7e3af] font-bold hover:underline">Sign In Here</a>
        </div>

    </div>
</div>
{% endblock %}
