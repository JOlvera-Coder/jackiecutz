{% extends 'base.html' %}
{% block title %}Sign In | Jackiecutz Hair Studio{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4 py-8 text-zinc-100">

  <div class="studio-logo-banner mb-6 max-w-sm w-full">
    <img src="{{ url_for('static', filename='img/card_bg.jpg') }}" alt="Jackiecutz Hair Studio" class="w-full h-auto drop-shadow-2xl">
  </div>

  <div class="w-full max-w-sm p-6 sm:p-7 rounded-3xl bg-zinc-950 border border-amber-500/30 shadow-2xl space-y-5">
    
    <form action="{{ url_for('main.login') }}" method="POST" class="space-y-4">
      
      <div>
        <label class="block text-[10px] font-black uppercase tracking-wider text-amber-400 mb-1.5">
          Username, Name, or Phone
        </label>
        <input 
          type="text" 
          name="username" 
          required 
          placeholder="Enter username, name, or phone" 
          class="w-full bg-[#fffaea] border border-[#dfba6b] rounded-xl px-3.5 py-2.5 text-xs text-black font-bold placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-400 transition"
        >
      </div>

      <div>
        <label class="block text-[10px] font-black uppercase tracking-wider text-amber-400 mb-1.5">
          Password (Stylists / Registered)
        </label>
        <input 
          type="password" 
          name="password" 
          placeholder="••••••••" 
          class="w-full bg-[#fffaea] border border-[#dfba6b] rounded-xl px-3.5 py-2.5 text-xs text-black font-bold placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-amber-400 transition"
        >
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" name="remember" class="w-3.5 h-3.5 rounded bg-zinc-900 border-zinc-700 text-amber-400 focus:ring-0">
          <span class="text-[11px] font-medium text-zinc-300">Remember Me</span>
        </label>
        <a href="#" class="text-[11px] font-bold text-amber-400 hover:text-amber-300 transition">Forgot Password?</a>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          class="w-full py-3 gold-btn text-black font-black uppercase tracking-wider text-xs rounded-xl transition shadow-lg"
        >
          Log In
        </button>
      </div>

      <div class="text-center pt-2 space-y-1.5 border-t border-zinc-900 mt-3">
        <p class="text-xs text-zinc-400">
          Need an account? 
          <a href="{{ url_for('main.register') if 'main.register' in url_for.__doc__ else '#' }}" class="font-bold text-white hover:text-amber-400 transition">Register</a>
        </p>
        <p class="text-[10px] text-zinc-500">
          By logging in, you agree to our 
          <a href="#" class="text-amber-400/80 hover:underline">Terms & Conditions</a> 
          and 
          <a href="#" class="text-amber-400/80 hover:underline">Privacy Policy</a>.
        </p>
      </div>

    </form>

  </div>

</div>
{% endblock %}
