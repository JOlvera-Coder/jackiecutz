<!-- Inside Ivonne's Queue Loop -->
<div style="display: flex; justify-content: space-between; align-items: center; background: #181714; border: 1px solid #332f27; padding: 14px 18px; border-radius: 12px; margin-bottom: 10px;">
    <div>
        <strong style="color: #fff; font-size: 1.1rem;">{{ appt.client_name }}</strong>
        <div style="font-size: 0.85rem; color: #a89f91;">
            {{ appt.service.name if appt.service else 'Haircut' }}
            {% if appt.payment_status == 'cash' %}
                <span style="background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; margin-left: 8px;">💵 COLLECT CASH</span>
            {% else %}
                <span style="background: #2c2820; border: 1px solid #d4af37; color: #d4af37; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin-left: 8px;">📱 IN-APP / INSTANT PAY</span>
            {% endif %}
        </div>
    </div>
    
    <form method="POST" action="{{ url_for('main.complete_checkout', appt_id=appt.id) }}">
        <button type="submit" style="background: #d4af37; color: #000; border: none; font-weight: 800; border-radius: 8px; padding: 8px 14px; cursor: pointer;">
            MARK PAID & DONE ✓
        </button>
    </form>
</div>
